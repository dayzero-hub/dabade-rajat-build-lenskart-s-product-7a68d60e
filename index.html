<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lenskart product card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <article class="card">
    <img src="https://placehold.co/600x400?text=Vincent+Chase+Round" alt="Black round Vincent Chase eyeglasses" width="600" height="400">
    <h2>Vincent Chase Round Eyeglasses</h2>
    <p><strong>₹1,999</strong> <s>₹3,999</s></p>
    <p><small>Also available in tortoise and gold</small></p>
    <button type="button">Buy now</button>
  </article>
</body>
</html>
